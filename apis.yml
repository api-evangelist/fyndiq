aid: fyndiq
name: Fyndiq
description: >-
  Fyndiq is Sweden's largest online marketplace for bargains and deals, connecting
  merchants with millions of deal-seeking consumers across categories from
  electronics and mobile accessories to home, fashion, beauty and children's
  goods. Merchants list products while Fyndiq handles the storefront, customer
  relations and payments. Fyndiq exposes a REST Merchant API that lets sellers
  upload and manage product articles (create, bulk, price, quantity, delete) and
  retrieve, fulfil and cancel orders. The API is JSON over HTTPS, secured with
  HTTP Basic Authentication (Base64 merchantID:token), with a self-contained
  sandbox environment for integration testing and official Magento, PrestaShop
  and WooCommerce integration modules. Fyndiq is part of the CDON marketplace
  group and was originally backed by Northzone.
