openapi: 3.2.0
info:
  title: merchant api gateway service Carrier Codes API
  version: 0.1.0
tags:
- name: Carrier Codes
paths:
  /api/v1/carrier-codes:
    get:
      summary: List Carrier Codes
      operationId: list_carrier_codes_api_v1_carrier_codes_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Client-Name
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Carrier Codes
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
