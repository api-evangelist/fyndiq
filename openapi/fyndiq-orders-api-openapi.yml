      summary: Fulfill Order
      operationId: fulfill_order_api_v1_orders__article_row_id__fulfill_put
      parameters:
      - name: article_row_id
        in: path
        required: true
        schema:
          type: string
          title: Article Row Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Client-Name
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Name
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Orders
  /api/v1/orders/{article_row_id}/cancel:
