openapi: 3.2.0
info:
  title: merchant api gateway service Orders API
  version: 0.1.0
tags:
- name: Orders
paths:
  /api/v1/orders:
    post:
      summary: Create Order
      operationId: create_order_api_v1_orders_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Client-Name
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Orders
    get:
      summary: Get All Orders
      operationId: get_all_orders_api_v1_orders_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Client-Name
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Orders
  /api/v1/orders/{order_id}:
    get:
      summary: Get Order
      operationId: get_order_api_v1_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Client-Name
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Orders
  /api/v1/orders/{article_row_id}/fulfill:
