  detail: >-
    List articles is paginated; callers can retrieve up to 1000 articles per
    page via limit/offset-style paging.
filtering:
  applies_to: [listOrders]
  detail: The order `state` field supports filtering (CREATED / FULFILLED / CANCELLED); new orders are returned by default.
